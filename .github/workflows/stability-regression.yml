name: Stability regression
on:
  push:
    branches: [fix/v10.1-stability, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: python -m unittest test_stability
      - run: python test_together.py
      - run: python test_guild.py
      - run: node test_stability.cjs
