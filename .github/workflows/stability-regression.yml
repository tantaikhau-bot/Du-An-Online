name: Stability regression
on:
  push:
    branches: [fix/v10.1-stability, fix/v10.5-assets, fix/v10.6-roster, fix/v10.7-living-characters, fix/v10.8-smooth-motion, fix/v10.9-world-life, fix/v11.0-locomotion, fix/v11.1-arm-clearance, fix/v11.2.1-recovery, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: python -m unittest test_stability test_asset_cache
      - run: python -c "from static_files import cached_asset; assert cached_asset('cat.glb'); assert cached_asset('rabbit.glb')"
      - run: python test_together.py
      - run: python test_guild.py
      - run: node test_stability.cjs
      - run: node test_graphics100.cjs

      - run: python -m pip install -r requirements-realtime.txt
      - run: python -m unittest test_infrastructure test_realtime test_world_life
      - run: python load_test_local.py --players 16 --rounds 5
      - run: python load_test_local.py --players 32 --rounds 3
      - run: python load_test_local.py --players 50 --rounds 3
      - run: node test_anime.cjs
      - run: node test_roster.cjs
      - run: node test_motion.cjs
      - run: npm install --no-save --no-package-lock three@0.164.1 playwright@1.51.1 @pixiv/three-vrm@2.1.2
      - run: node test_foot_ik.cjs
      - run: node test_arm_motion.cjs
      - run: node test_original_avatar.cjs
      - run: node test_fantasy_creatures.cjs
      - run: npx playwright install --with-deps chromium
      - run: python tools/fetch_vrm.py
      - run: node test_anime_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-character-preview
          path: test-output/
          if-no-files-found: ignore
