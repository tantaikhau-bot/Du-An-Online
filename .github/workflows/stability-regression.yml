name: Stability regression
on:
  push:
    branches: [fix/v10.1-stability, fix/v10.5-assets, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: python -m unittest test_stability test_asset_cache
      - run: python test_together.py
      - run: python test_guild.py
      - run: node test_stability.cjs

      - run: python -m pip install -r requirements-realtime.txt
      - run: python -m unittest test_infrastructure test_realtime
      - run: python load_test_local.py --players 16 --rounds 5
      - run: node test_anime.cjs
      - run: npm install --no-save --no-package-lock three@0.164.1 playwright@1.51.1 @pixiv/three-vrm@2.1.2
      - run: npx playwright install --with-deps chromium
      - run: python tools/fetch_vrm.py
      - run: node test_anime_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-character-preview
          path: test-output/
          if-no-files-found: ignore
