name: Wish World release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q .
      - run: python test_release347.py
      - run: python test_release3520.py
      - run: python -m unittest test_stability
      - run: node test_peer_cleanup357.cjs
      - run: node test_housing358.cjs
      - run: node test_ready359.cjs
      - run: node test_fortress3510.cjs
      - run: node test_environment3511.cjs
      - run: node test_desktop_pressure3511.cjs
      - run: node test_animation3512.cjs
      - run: node test_character3523.cjs
      - run: npm install --no-save --no-package-lock three@0.164.1
      - run: node test_original3524.cjs
      - run: node test_skeletal3525.cjs
      - run: node test_lighting3513.cjs
      - run: node test_startup3521.cjs
      - run: node test_clarity3522.cjs
      - run: node test_performance3514.cjs
      - run: node test_world_quality3515.cjs
      - run: python test_foundation350.py
      - run: node test_performance349.cjs
      - run: node test_character352.cjs
      - run: node test_mobile_quality355.cjs
      - run: node test_graphics100.cjs
      - run: node test_multiplayer270.cjs
      - run: node test_world245.cjs
      - run: python -m unittest test_combat281
      - run: python test_http_assets.py
      - run: python test_together.py
      - run: python test_guild.py

      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node test_mobile_hud348.cjs
