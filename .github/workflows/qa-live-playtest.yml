name: Live guest playtest
on: pull_request
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: node qa_live_playtest.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-playtest
          path: qa-output/
