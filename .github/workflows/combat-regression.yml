name: Combat regression
on:
  push:
    branches: [main]
    paths: ['dungeon.py', 'test_combat281.py', 'server.py', 'index.html', 'test_camera319.cjs', 'test_combat_motion320.cjs', 'assets/vrm-character.js', 'assets/foot-ik.js', '.github/workflows/combat-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile dungeon.py server.py test_combat281.py
      - run: python -m unittest -v test_combat281
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test_camera319.cjs
      - run: node test_combat_motion320.cjs
