services:
  game:
    build: .
    restart: unless-stopped
    environment:
      WISH_ADMIN_PASSWORD: ${WISH_ADMIN_PASSWORD:?Set admin password in .env}
      WISH_SECURE: '1'
      WISH_TRUST_PROXY: '1'
    volumes:
      - game_data:/data
    expose: ['8080']
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      WISH_DOMAIN: ${WISH_DOMAIN:?Set domain in .env}
    ports: ['80:80','443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      game:
        condition: service_healthy
volumes:
  game_data:
  caddy_data:
  caddy_config:
